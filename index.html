<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7A716D">
<title>Digital Rose</title>
<style>
  :root {
    --veil: #7A716D;
    --ink: #f3ece4;
    --ink-dim: rgba(243, 236, 228, 0.52);
    --ink-faint: rgba(243, 236, 228, 0.28);
    --rose: #c9899a;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--veil); color: var(--ink);
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; background: var(--veil); }
  #stage img, #stage video, #stage canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block;
  }
  #rose, #live { object-fit: cover; object-position: center; }
  #rose, #grow, #live { visibility: hidden; }
  body.mode-genome #grow { visibility: visible; }
  body.mode-genome #veil { visibility: hidden; pointer-events: none; }
  #live { background: #2a2624; }
  #brush {
    position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; border: 1.5px solid rgba(243, 236, 228, 0.42);
    background: rgba(243, 236, 228, 0.06);
    pointer-events: none; opacity: 0; transition: opacity 160ms linear;
    z-index: 3;
  }
  body.is-drawing #brush { opacity: 1; }
  #hint {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    display: grid; place-items: center;
    transition: opacity 700ms ease;
  }
  #hint.gone { opacity: 0; }
  .hint-word {
    position: absolute; letter-spacing: 0.42em; font-size: 13px;
    color: var(--ink-dim); text-transform: lowercase;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .hint-finger {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid rgba(243, 236, 228, 0.55);
    background: rgba(243, 236, 228, 0.10);
    box-shadow: 0 0 0 8px rgba(243, 236, 228, 0.05);
    animation: swipe 2.8s ease-in-out infinite;
  }
  @keyframes swipe {
    0%   { transform: translate(-54px, 18px) scale(0.86); opacity: 0; }
    12%  { opacity: 1; }
    50%  { transform: translate(18px, -36px) scale(1); opacity: 1; }
    88%  { opacity: 0.2; }
    100% { transform: translate(62px, 10px) scale(0.9); opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 0.62; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint-finger, .hint-word { animation: none; opacity: 0.5; }
  }
  .hud {
    position: fixed; z-index: 6; pointer-events: none;
    font-size: 12px; letter-spacing: 0.12em; color: var(--ink-dim);
    text-shadow: 0 1px 8px rgba(40, 32, 28, 0.35);
  }
  .hud button, .hud a {
    pointer-events: auto; appearance: none; border: 0; background: transparent;
    color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer;
    padding: 10px 8px; min-height: 40px; text-decoration: none;
  }
  .hud button[aria-pressed="false"],
  .hud a:not(.on) { color: var(--ink-faint); }
  .hud button[aria-pressed="true"],
  .hud a.on { color: var(--ink); }
  .hud button:focus-visible, .hud a:focus-visible { outline: 1px solid var(--rose); }
  #brand { top: calc(10px + var(--safe-t)); left: calc(14px + var(--safe-l)); }
  #brand span { letter-spacing: 0.22em; font-size: 11px; color: var(--ink-faint); }
  #modes { top: calc(6px + var(--safe-t)); right: calc(8px + var(--safe-r)); }
  #modes a { padding: 10px 7px; }
  #modes a.on { box-shadow: inset 0 -1px 0 var(--rose); }
  #toggles { bottom: calc(8px + var(--safe-b)); left: calc(6px + var(--safe-l)); }
  #meta {
    bottom: calc(18px + var(--safe-b)); right: calc(16px + var(--safe-r));
    pointer-events: none; font-variant-numeric: tabular-nums;
    letter-spacing: 0.18em; font-size: 11px;
  }
  #tools {
    bottom: calc(42px + var(--safe-b)); right: calc(6px + var(--safe-r));
    display: flex; flex-direction: column; align-items: flex-end; gap: 0;
  }
  #tools[hidden] { display: none; }
  #note {
    position: fixed; left: 50%; bottom: calc(18px + var(--safe-b));
    transform: translateX(-50%);
    z-index: 6; font-size: 11px; letter-spacing: 0.16em;
    color: var(--ink-dim); pointer-events: none; opacity: 0;
    transition: opacity 400ms ease; text-align: center; max-width: 86vw;
  }
  #note.show { opacity: 1; }
</style>
</head>
<body class="mode-rose">
<div id="stage">
  <img id="rose" alt="">
  <canvas id="grow"></canvas>
  <video id="live" playsinline muted autoplay></video>
  <canvas id="veil"></canvas>
  <div id="brush"></div>
  <div id="hint">
    <div class="hint-finger" aria-hidden="true"></div>
    <div class="hint-word">swipe</div>
  </div>
</div>
<div class="hud" id="brand"><span>Digital Rose</span></div>
<nav class="hud" id="modes">
  <a href="?mode=rose" data-mode="rose" class="on">rose</a>
  <a href="?mode=genome" data-mode="genome">genome</a>
  <a href="?mode=live" data-mode="live">live</a>
</nav>
<div class="hud" id="toggles">
  <button id="btnSound" type="button" aria-pressed="true" title="sound on">♪</button>
  <button id="btnHaptic" type="button" aria-pressed="true" title="vibrate on">∴</button>
</div>
<div class="hud" id="meta"></div>
<div class="hud" id="tools" hidden></div>
<div id="note"></div>

/* genome mappings: tweak freely */
const GENOME = {
  fastSpeed: 1.55,       // px/ms  → skinny, jittery, high
  slowSpeed: 0.22,       // px/ms  → fat petals, held note
  circleCurv: 0.28,      // rad per point treated as circling
  dwellMs: 150,          // linger this long to bloom
  stemMin: 1.15,
  stemMax: 17,
  jitter: 0.62,
  branchOdds: 0.10,
  branchLen: 54,
  petalMin: 7,
  petalMax: 34,
  petalLayers: 5,
  leafOdds: 0.17,
  dustOdds: 0.55,
  petalH: 338, petalS: 46, petalL: 64,
  stemH: 86,   stemS: 24,  stemL: 34,
  dustH: 28,   dustS: 18,  dustL: 72,
  tickHzLo: 196,
  tickHzHi: 698,
  holdGain: 0.045,
  tickGain: 0.042
};

const VEIL = "#7A716D";
const MIN_SIDE = 10;       // stop splitting below ~10px (Paper.js feel)
const MOVE_MIN = 10;       // ignore pointer travel shorter than this
const TILE = 26;           // genome stroke interpolation only
const VIB_MS = [8, 15];

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const map = (v, a, b, c, d) => lerp(c, d, clamp((v - a) / (b - a || 1), 0, 1));
const hypot = Math.hypot;
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const params = new URLSearchParams(location.search);
let mode = (params.get("mode") || "rose").toLowerCase();
if (!["rose", "genome", "live"].includes(mode)) mode = "rose";

const Sound = {
  ctx: null,
  muted: false,
  hold: null,
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) this.ctx = new AC();
    if (this.ctx.state === "suspended") this.ctx.resume();
    try {
      const b = this.ctx.createBuffer(1, 1, 22050);
      const s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start();
    } catch (e) {}
  },
  setMuted(on) { this.muted = !on; if (!on) this.release(); },
  tick(nx, ny, n) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const hz = GENOME.tickHzLo + nx * (GENOME.tickHzHi - GENOME.tickHzLo) * 0.7 + (1 - ny) * 140;
    o.type = "sine";
    o.frequency.setValueAtTime(hz, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(80, hz * 0.72), t + 0.045);
    const gain = GENOME.tickGain / Math.sqrt(Math.max(1, n));
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.055);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.06);
  },
  holdStart(hz) {
    if (this.muted || !this.ctx) return;
    this.release();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(hz, t);
    g.gain.setValueAtTime(0.0008, t);
    g.gain.exponentialRampToValueAtTime(GENOME.holdGain, t + 0.08);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t);
    this.hold = { o, g };
  },
  holdMove(hz) {
    if (!this.hold || !this.ctx) return;
    this.hold.o.frequency.setTargetAtTime(hz, this.ctx.currentTime, 0.05);
  },
  release() {
    if (!this.hold || !this.ctx) return;
    const { o, g } = this.hold;
    const t = this.ctx.currentTime;
    try { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0.0008, t, 0.06); } catch (e) {}
    try { o.stop(t + 0.22); } catch (e) {}
    this.hold = null;
  }
};

const Haptic = {
  on: true,
  pulse(n) {
    if (!this.on || !navigator.vibrate) return;
    const ms = clamp(VIB_MS[0] + Math.min(n, 4) * 1.6, VIB_MS[0], VIB_MS[1]);
    try { navigator.vibrate(ms); } catch (e) {}
  }
};

const Mosaic = {
  cv: $("veil"),
  ctx: null,
  cells: [],
  w: 0,
  h: 0,
  lastX: 0,
  lastY: 0,
  ready: false,
  frame: null,
  frameCtx: null,
  iR: null,
  iG: null,
  iB: null,
  iW: 0,
  iw: 0,
  ih: 0,

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.cv.width = Math.max(1, Math.floor(this.w * dpr));
    this.cv.height = Math.max(1, Math.floor(this.h * dpr));
    this.cv.style.width = this.w + "px";
    this.cv.style.height = this.h + "px";
    this.ctx = this.cv.getContext("2d", { alpha: false });
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!this.frame || this.frame.width !== this.w || this.frame.height !== this.h) {
      this.frame = document.createElement("canvas");
      this.frame.width = Math.max(1, this.w);
      this.frame.height = Math.max(1, this.h);
      this.frameCtx = this.frame.getContext("2d", { willReadFrequently: true, alpha: false });
    }
    this.capture(true);
    this.reset();
  },

  source() {
    const v = $("live");
    if (mode === "live" && v && v.readyState >= 2 && v.videoWidth > 0) return v;
    const img = $("rose");
    if (img && img.naturalWidth) return img;
    return null;
  },

  coverBlit(src) {
    const c = this.frameCtx;
    if (!c) return false;
    const iw = src.videoWidth || src.naturalWidth || src.width || 0;
    const ih = src.videoHeight || src.naturalHeight || src.height || 0;
    c.fillStyle = VEIL;
    c.fillRect(0, 0, this.w, this.h);
    if (!iw || !ih) return false;
    const ir = iw / ih, vr = this.w / this.h;
    let dw, dh, dx, dy;
    if (ir > vr) {
      dh = this.h;
      dw = this.h * ir;
      dx = (this.w - dw) / 2;
      dy = 0;
    } else {
      dw = this.w;
      dh = this.w / ir;
      dx = 0;
      dy = (this.h - dh) / 2;
    }
    c.drawImage(src, dx, dy, dw, dh);
    return true;
  },

  buildIntegral() {
    const w = this.frame.width, h = this.frame.height;
    const data = this.frameCtx.getImageData(0, 0, w, h).data;
    const W = w + 1;
    const R = new Float64Array(W * (h + 1));
    const G = new Float64Array(W * (h + 1));
    const B = new Float64Array(W * (h + 1));
    for (let y = 1; y <= h; y++) {
      let rowR = 0, rowG = 0, rowB = 0;
      for (let x = 1; x <= w; x++) {
        const i = ((y - 1) * w + (x - 1)) * 4;
        rowR += data[i];
        rowG += data[i + 1];
        rowB += data[i + 2];
        const p = y * W + x;
        const above = (y - 1) * W + x;
        R[p] = R[above] + rowR;
        G[p] = G[above] + rowG;
        B[p] = B[above] + rowB;
      }
    }
    this.iR = R; this.iG = G; this.iB = B;
    this.iW = W; this.iw = w; this.ih = h;
    this.ready = true;
  },

  capture(forceStill) {
    const src = forceStill && mode !== "live" ? $("rose") : this.source();
    const ok = src ? this.coverBlit(src) : false;
    if (!ok && this.frameCtx) {
      this.frameCtx.fillStyle = VEIL;
      this.frameCtx.fillRect(0, 0, this.w, this.h);
    }
    this.buildIntegral();
  },

  avg(x, y, w, h) {
    if (!this.iR) return VEIL;
    const x0 = clamp(Math.floor(x), 0, this.iw);
    const y0 = clamp(Math.floor(y), 0, this.ih);
    const x1 = clamp(Math.ceil(x + w), 0, this.iw);
    const y1 = clamp(Math.ceil(y + h), 0, this.ih);
    if (x1 <= x0 || y1 <= y0) return VEIL;
    const W = this.iW;
    const A = y1 * W + x1, B = y0 * W + x1, C = y1 * W + x0, D = y0 * W + x0;
    const area = (x1 - x0) * (y1 - y0);
    const r = Math.round((this.iR[A] - this.iR[B] - this.iR[C] + this.iR[D]) / area);
    const g = Math.round((this.iG[A] - this.iG[B] - this.iG[C] + this.iG[D]) / area);
    const b = Math.round((this.iB[A] - this.iB[B] - this.iB[C] + this.iB[D]) / area);
    return "rgb(" + r + "," + g + "," + b + ")";
  },

  reset() {
    if (!this.ctx) return;
    if (mode === "live") this.capture(false);
    else this.capture(true);
    this.cells = [{
      x: 0, y: 0, w: this.w, h: this.h,
      color: this.avg(0, 0, this.w, this.h)
    }];
    this.lastX = this.w * 0.5;
    this.lastY = this.h * 0.5;
    this.paintAll();
  },

  paintAll() {
    const c = this.ctx;
    if (!c) return;
    c.fillStyle = VEIL;
    c.fillRect(0, 0, this.w, this.h);
    for (let i = 0; i < this.cells.length; i++) this.paintCell(this.cells[i]);
  },

  paintCell(cell) {
    if (!this.ctx) return;
    this.ctx.fillStyle = cell.color;
    this.ctx.fillRect(cell.x, cell.y, cell.w, cell.h);
  },

  remaining() {
    const minSplit = MIN_SIDE * 2;
    let large = 0;
    for (let i = 0; i < this.cells.length; i++) {
      const cell = this.cells[i];
      if (Math.min(cell.w, cell.h) >= minSplit) large += cell.w * cell.h;
    }
    return Math.round((large / (this.w * this.h || 1)) * 100);
  },

  hit(x, y) {
    for (let i = this.cells.length - 1; i >= 0; i--) {
      const cell = this.cells[i];
      if (x >= cell.x && y >= cell.y && x < cell.x + cell.w && y < cell.y + cell.h) return i;
    }
    return -1;
  },

  move(x, y) {
    if (!this.ctx || !this.ready) return [];
    if (hypot(x - this.lastX, y - this.lastY) < MOVE_MIN) return [];
    this.lastX = x;
    this.lastY = y;
    return this.splitAt(x, y);
  },

  splitAt(x, y) {
    const i = this.hit(x, y);
    if (i < 0) return [];
    const cell = this.cells[i];
    const isLandscape = cell.w > cell.h;
    if ((isLandscape ? cell.w : cell.h) < MIN_SIDE * 2) return [];
    if (mode === "live") this.capture(false);
    const midW = cell.w / 2, midH = cell.h / 2;
    const a = isLandscape
      ? { x: cell.x, y: cell.y, w: Math.ceil(midW), h: cell.h }
      : { x: cell.x, y: cell.y, w: cell.w, h: Math.ceil(midH) };
    const b = isLandscape
      ? { x: cell.x + a.w, y: cell.y, w: cell.w - a.w, h: cell.h }
      : { x: cell.x, y: cell.y + a.h, w: cell.w, h: cell.h - a.h };
    a.color = this.avg(a.x, a.y, a.w, a.h);
    b.color = this.avg(b.x, b.y, b.w, b.h);
    a.nx = (a.x + a.w * 0.5) / this.w;
    a.ny = (a.y + a.h * 0.5) / this.h;
    b.nx = (b.x + b.w * 0.5) / this.w;
    b.ny = (b.y + b.h * 0.5) / this.h;
    this.cells.splice(i, 1, a, b);
    this.paintCell(a);
    this.paintCell(b);
    return [a, b];
  }
};

const Plant = {
  cv: $("grow"),
  ctx: null,
  seed: 0,
  rng: Math.random,
  last: null,
  dwell: 0,
  turn: 0,
  lastAng: 0,
  stats: { len: 0, n: 0, spd: 0, curv: 0 },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    const keep = this.cv.width ? this.cv : null;
    const tmp = document.createElement("canvas");
    if (keep) {
      tmp.width = this.cv.width; tmp.height = this.cv.height;
      tmp.getContext("2d").drawImage(this.cv, 0, 0);
    }
    this.cv.width = Math.floor(w * dpr);
    this.cv.height = Math.floor(h * dpr);
    this.cv.style.width = w + "px";
    this.cv.style.height = h + "px";
    this.ctx = this.cv.getContext("2d");
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.lineJoin = "round";
    this.ctx.lineCap = "round";
    if (keep) this.ctx.drawImage(tmp, 0, 0, w, h);

  },
  reseed(n) {
    this.seed = (n >>> 0) || (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
    this.rng = mulberry32(this.seed);

  },
  clear() {

    c.fillStyle = VEIL;
    c.fillRect(0, 0, window.innerWidth, window.innerHeight);

    c.fillStyle = "rgba(40,34,30,0.045)";
    for (let i = 0; i < 40; i++) {
      c.beginPath();
      c.arc(g() * window.innerWidth, g() * window.innerHeight, 20 + g() * 90, 0, TAU);

  reset() { this.reseed(); this.clear(); },
  feed(x, y, dt) {
    const c = this.ctx;

    const dx = x - this.last.x, dy = y - this.last.y;
    const dist = hypot(dx, dy);
    const speed = dist / Math.max(dt, 8);
    const ang = Math.atan2(dy, dx);

    while (dAng > Math.PI) dAng -= TAU;
    while (dAng < -Math.PI) dAng += TAU;

      this.turn = this.turn * 0.72 + Math.abs(dAng);
      this.dwell = 0;
    } else {
      this.dwell += dt;
    }
    this.stats.len += dist;
    this.stats.n += 1;
    this.stats.spd += speed;
    this.stats.curv += Math.abs(dAng);

    const r = this.rng;
    const fast = speed > GENOME.fastSpeed;
    const slow = speed < GENOME.slowSpeed || this.dwell > GENOME.dwellMs;
    const circling = this.turn > GENOME.circleCurv;
    const width = map(speed, GENOME.fastSpeed, GENOME.slowSpeed, GENOME.stemMin, GENOME.stemMax);
    const j = fast ? GENOME.jitter * (8 + speed * 10) : GENOME.jitter * 2;
    const mx = (this.last.x + x) / 2 + (r() - 0.5) * j;
    const my = (this.last.y + y) / 2 + (r() - 0.5) * j;

    c.strokeStyle = `hsla(${GENOME.stemH + (r() - 0.5) * 14}, ${GENOME.stemS}%, ${GENOME.stemL + (slow ? 6 : 0)}%, ${fast ? 0.42 : 0.72})`;
    c.lineWidth = clamp(width, GENOME.stemMin, GENOME.stemMax);

    c.moveTo(this.last.x, this.last.y);
    c.quadraticCurveTo(mx, my, x, y);
    c.stroke();

    let grew = 0;
    if (fast && r() < GENOME.dustOdds) {
      grew++;
      const n = 3 + (r() * 5) | 0;
      for (let i = 0; i < n; i++) {
        c.fillStyle = `hsla(${GENOME.dustH + r() * 20}, ${GENOME.dustS}%, ${GENOME.dustL}%, 0.35)`;
        c.fillRect(x + (r() - 0.5) * 22, y + (r() - 0.5) * 22, 1 + r() * 2, 1 + r() * 2);
      }
      if (r() < 0.45) {
        const a = ang + (r() - 0.5) * 1.8;
        const L = 6 + r() * 16;
        c.strokeStyle = `hsla(${GENOME.stemH}, 18%, 28%, 0.45)`;
        c.lineWidth = 0.8;
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L);
        c.stroke();

    }

      const size = map(circling ? 0.1 : speed, GENOME.fastSpeed, 0.05, GENOME.petalMin, GENOME.petalMax) * (circling ? 1.15 : 1);
      if (r() < (circling ? 0.55 : 0.28) || this.dwell > GENOME.dwellMs) {
        this.bloom(x, y, size, r);

        this.dwell = 0;
        this.turn *= 0.4;
      }
    }

    if (r() < GENOME.leafOdds * (slow ? 1.4 : 0.7)) {
      this.leaf(x, y, ang + (r() < 0.5 ? 1.1 : -1.1), 8 + r() * 14, r);
      grew++;
    }
    if (r() < GENOME.branchOdds) {
      this.branch(x, y, ang, r);
      grew++;
    }
    this.last = now;
    return grew;
  },
  bloom(x, y, size, r) {

    const layers = GENOME.petalLayers;
    const petals = 5 + ((r() * 4) | 0);
    const rot = r() * TAU;
    for (let i = 0; i < layers; i++) {
      const s = size * (1 - i * 0.14);
      for (let p = 0; p < petals; p++) {
        const a = rot + (p / petals) * TAU + i * 0.12;
        const px = x + Math.cos(a) * s * 0.32;
        const py = y + Math.sin(a) * s * 0.32;
        c.fillStyle = `hsla(${GENOME.petalH + (r() - 0.5) * 16}, ${GENOME.petalS}%, ${GENOME.petalL - i * 5}%, ${0.16 + i * 0.04})`;
        c.beginPath();
        c.ellipse(px, py, s * 0.52, s * 0.22, a, 0, TAU);
        c.fill();
      }
    }
    c.fillStyle = `hsla(${GENOME.petalH - 12}, 42%, 40%, 0.45)`;
    c.beginPath();
    c.arc(x, y, Math.max(1.2, size * 0.08), 0, TAU);
    c.fill();
  },
  leaf(x, y, ang, size, r) {
    const c = this.ctx;
    c.save();
    c.translate(x, y);
    c.rotate(ang);
    c.fillStyle = `hsla(${GENOME.stemH + (r() - 0.5) * 18}, 28%, ${30 + r() * 10}%, 0.5)`;
    c.beginPath();
    c.ellipse(size * 0.55, 0, size * 0.55, size * 0.2, 0, 0, TAU);
    c.fill();
    c.restore();
  },
  branch(x, y, ang, r) {
    const c = this.ctx;
    const dir = ang + (r() < 0.5 ? 1 : -1) * (0.6 + r() * 0.9);
    const len = GENOME.branchLen * (0.45 + r() * 0.7);
    const x2 = x + Math.cos(dir) * len;
    const y2 = y + Math.sin(dir) * len;
    const cx = x + Math.cos(dir + (r() - 0.5)) * len * 0.5;
    const cy = y + Math.sin(dir + (r() - 0.5)) * len * 0.5;
    c.strokeStyle = `hsla(${GENOME.stemH}, ${GENOME.stemS}%, ${GENOME.stemL}%, 0.55)`;
    c.lineWidth = 1.1 + r() * 2.2;
    c.beginPath();
    c.moveTo(x, y);
    c.quadraticCurveTo(cx, cy, x2, y2);
    c.stroke();
    if (r() < 0.55) this.bloom(x2, y2, GENOME.petalMin + r() * 10, r);
    else this.leaf(x2, y2, dir, 7 + r() * 10, r);
  },
  pointerUp() { this.last = null; this.dwell = 0; }
};
const AXIAL = 'https://elem-delta.oceanobservatories.org/out/u/camhd.m3u8';
const MUX = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
const HLS_CDN = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js';
const GUM = 'getUserMedia';
const MDEV = 'mediaDevices';

const Live = {
  video: $("live"),
  hls: null,
  stream: null,
  current: "camera",
  async stop() {
    if (this.hls) { try { this.hls.destroy(); } catch (e) {} this.hls = null; }
    this.video.removeAttribute("src");
    try { this.video.pause(); this.video.srcObject = null; this.video.load(); } catch (e) {}
    if (this.stream) {
      this.stream.getTracks().forEach((t) => t.stop());
      this.stream = null;
    }
  },
  still() {
    this.video.poster = ROSE;
    this.video.srcObject = null;
    this.video.removeAttribute("src");
    Mosaic.reset();
    whisper("source unavailable — still");
  },
  async camera() {
    this.current = "camera";
    await this.stop();
    const bag = navigator[MDEV];
    if (!bag || !bag[GUM]) { this.still(); return; }
    try {
      this.stream = await bag[GUM]({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      this.video.srcObject = this.stream;
      this.video.poster = "";
      await this.video.play().catch(() => {});
      Mosaic.reset();
      whisper("scratch opens you");
    } catch (e) {
      this.still();
    }
  },
  loadHlsScript() {
    return new Promise((resolve, reject) => {
      if (window.Hls) return resolve(window.Hls);
      const s = document.createElement("script");
      s.src = HLS_CDN;
      s.async = true;
      s.onload = () => resolve(window.Hls);
      s.onerror = () => reject(new Error("helper blocked"));
      document.head.appendChild(s);
    });
  },
  async probe(url) {
    const r = await fetch(url, { mode: "cors" });
    if (!r.ok) throw new Error("http " + r.status);
    const text = await r.text();
    if (!text || (!text.includes("#EXTINF") && !text.includes("#EXT-X-STREAM-INF"))) {
      throw new Error("idle");
    }
    return text;
  },
  async hlsUrl(url, label) {
    this.current = url;
    await this.stop();
    const v = this.video;
    v.poster = "";
    const native = v.canPlayType("application/vnd.apple.mpegurl");
    try {
      await this.probe(url);
    } catch (e) {
      try {
        v.src = url;
        await v.play();
        Mosaic.reset();
        whisper(label || "live");
        return;
      } catch (e2) {
        whisper((label || "stream") + " idle or blocked — trying you");
        await this.camera();
        return;
      }
    }
    try {
      if (native && !window.Hls) {
        v.src = url;
        await v.play();
        Mosaic.reset();
        whisper(label || "live");
        return;
      }
      const Lib = await this.loadHlsScript();
      if (Lib && Lib.isSupported()) {
        this.hls = new Lib({ enableWorker: true, lowLatencyMode: false });
        this.hls.loadSource(url);
        this.hls.attachMedia(v);
        this.hls.on(Lib.Events.ERROR, (_, data) => {
          if (data && data.fatal) {
            whisper("stream failed — you");
            this.camera();
          }
        });
        await v.play().catch(() => {});
        Mosaic.reset();
        whisper(label || "live");
        return;
      }
      if (native) {
        v.src = url;
        await v.play();
        Mosaic.reset();
        whisper(label || "live");
        return;
      }
      throw new Error("no helper");
    } catch (e) {
      whisper("stream failed — you");
      await this.camera();
    }
  },
  async start(src) {
    this.video.poster = ROSE;
    const q = src || params.get("src") || "camera";
    if (q === "camera" || q === "you") return this.camera();
    if (q === "axial" || q === "seamount") return this.hlsUrl(AXIAL, "Axial Seamount · scheduled");
    if (q === "reel" || q === "demo" || q === "mux") return this.hlsUrl(MUX, "demo reel");
    return this.hlsUrl(q, "custom");
  }
};

function whisper(msg) {
  const n = $("note");
  n.textContent = msg || "";
  n.classList.toggle("show", !!msg);
  clearTimeout(whisper._t);
  if (msg) whisper._t = setTimeout(() => n.classList.remove("show"), 3200);
}

function setMeta() {
  const el = $("meta");
  if (mode === "rose" || mode === "live") el.textContent = Mosaic.remaining() + "";
  else el.textContent = "·" + (Plant.seed >>> 0).toString(16).slice(-4);
}

function setTools() {
  const el = $("tools");
  if (mode === "genome") {
    el.hidden = false;
    el.innerHTML = '<button type="button" id="btnNew" title="new seed">new</button>';
    $("btnNew").onclick = () => { Plant.reset(); setMeta(); whisper("new seed"); };
  } else if (mode === "live") {
    el.hidden = false;
    el.innerHTML =
      '<button type="button" data-src="camera">you</button>' +
      '<button type="button" data-src="axial">seamount</button>' +
      '<button type="button" data-src="reel">reel</button>';
    el.querySelectorAll("[data-src]").forEach((b) => {
      b.onclick = () => Live.start(b.dataset.src);
    });
  } else {
    el.hidden = true;
    el.innerHTML = "";
  }
}

function setMode(next, fromUrl) {
  if (!["rose", "genome", "live"].includes(next)) next = "rose";
  const prev = mode;
  mode = next;
  document.body.classList.remove("mode-rose", "mode-genome", "mode-live");
  document.body.classList.add("mode-" + mode);
  document.querySelectorAll("#modes a").forEach((a) => {
    a.classList.toggle("on", a.dataset.mode === mode);
  });
  if (!fromUrl) {
    const u = new URL(location.href);
    u.searchParams.set("mode", mode);
    if (mode !== "live") u.searchParams.delete("src");
    history.replaceState(null, "", u);
  }
  if (prev === "live" && mode !== "live") Live.stop();
  if (mode === "rose") Mosaic.reset();
  else if (mode === "genome") {
    if (!Plant.seed) Plant.reseed();
    Plant.clear();
  } else if (mode === "live") {
    Mosaic.reset();
    Live.video.poster = ROSE;
    Live.start(params.get("src"));
  }
  setTools();
  setMeta();
}

let drawing = false;
let lastPt = null;
let hinted = false;

function hideHint() {
  if (hinted) return;
  hinted = true;
  $("hint").classList.add("gone");
}

function onDown(e) {
  if (e.button != null && e.button !== 0) return;
  Sound.unlock();
  drawing = true;
  document.body.classList.add("is-drawing");
  const x = e.clientX, y = e.clientY;
  lastPt = { x, y, t: performance.now() };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  if (mode === "genome") {
    hideHint();
    stroke(x, y, 16);
    const hz = map(y, window.innerHeight, 0, GENOME.tickHzLo, GENOME.tickHzHi);
    Sound.holdStart(hz);
  } else {
    reveal(x, y);
  }
}

function onMove(e) {
  $("brush").style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px)";
  if (mode === "rose" || mode === "live") {
    reveal(e.clientX, e.clientY);
    return;
  }
  if (!drawing) return;
  const now = performance.now();
  const dt = now - (lastPt ? lastPt.t : now);
  if (lastPt) {
    const d = hypot(e.clientX - lastPt.x, e.clientY - lastPt.y);
    const step = TILE * 0.42;
    const n = Math.max(1, Math.ceil(d / step));
    for (let i = 1; i <= n; i++) {
      const t = i / n;
      stroke(lerp(lastPt.x, e.clientX, t), lerp(lastPt.y, e.clientY, t), dt / n);
    }
  } else {
    stroke(e.clientX, e.clientY, dt);
  }
  lastPt = { x: e.clientX, y: e.clientY, t: now };
  const hz = map(e.clientY, window.innerHeight, 0, GENOME.tickHzLo, GENOME.tickHzHi);
  Sound.holdMove(hz);
}

function onUp() {
  drawing = false;
  lastPt = null;
  document.body.classList.remove("is-drawing");
  Plant.pointerUp();
  Sound.release();
}

function reveal(x, y) {
  const fresh = Mosaic.move(x, y);
  if (!fresh.length) return;
  hideHint();
  Haptic.pulse(fresh.length);
  for (const t of fresh) Sound.tick(t.nx, t.ny, fresh.length);
  setMeta();
}

function stroke(x, y, dt) {
  if (mode === "genome") {
    const grew = Plant.feed(x, y, dt || 16);
    if (grew) {
      Haptic.pulse(grew);
      Sound.tick(x / window.innerWidth, y / window.innerHeight, grew);
      setMeta();
    }
    return;
  }
  reveal(x, y);
}

function boot() {
  const img = $("rose");
  img.src = ROSE;
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    Mosaic.resize();
    Plant.resize();
    Plant.reseed();
    setMode(mode, true);
    if (params.get("shot")) {
      hideHint();
      $("hint").style.display = "none";
      demoSwipe();
    }
  };
  if (img.complete && img.naturalWidth) start();
  else {
    img.addEventListener("load", start, { once: true });
    img.addEventListener("error", start, { once: true });
    setTimeout(start, 1200);
  }

  const stage = $("stage");
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", onUp);
  stage.addEventListener("pointerleave", (e) => { if (drawing) onUp(e); });

  $("btnSound").onclick = () => {
    const on = $("btnSound").getAttribute("aria-pressed") !== "true";
    $("btnSound").setAttribute("aria-pressed", on ? "true" : "false");
    $("btnSound").title = on ? "sound on" : "sound off";
    Sound.unlock();
    Sound.setMuted(on);
  };
  $("btnHaptic").onclick = () => {
    const on = $("btnHaptic").getAttribute("aria-pressed") !== "true";
    $("btnHaptic").setAttribute("aria-pressed", on ? "true" : "false");
    $("btnHaptic").title = on ? "vibrate on" : "vibrate off";
    Haptic.on = on;
    if (on) Haptic.pulse(1);
  };

  document.querySelectorAll("#modes a").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      setMode(a.dataset.mode);
    });
  });

  window.addEventListener("resize", () => {
    Mosaic.resize();
    Plant.resize();
    setMeta();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) Sound.release();
  });
}

function demoSwipe() {
  const W = window.innerWidth, H = window.innerHeight;
  const path = [];
  if (mode === "genome") {
    for (let i = 0; i <= 120; i++) {
      const t = i / 120;
      path.push({
        x: W * (0.22 + t * 0.58 + Math.sin(t * 8) * 0.05),
        y: H * (0.78 - t * 0.52 + Math.cos(t * 5) * 0.07),
        linger: false
      });
    }
    const cx = W * 0.64, cy = H * 0.36;
    for (let i = 0; i <= 70; i++) {
      const a = (i / 70) * TAU;
      path.push({ x: cx + Math.cos(a) * 34, y: cy + Math.sin(a) * 26, linger: true });
    }
    const cx2 = W * 0.38, cy2 = H * 0.52;
    for (let i = 0; i <= 40; i++) {
      const a = (i / 40) * TAU;
      path.push({ x: cx2 + Math.cos(a) * 18, y: cy2 + Math.sin(a) * 14, linger: true });
    }
  } else {
    for (let i = 0; i <= 90; i++) {
      const t = i / 90;
      const a = t * TAU * 1.25;
      path.push({
        x: W * 0.5 + Math.cos(a) * W * 0.24 * (0.35 + t),
        y: H * 0.48 + Math.sin(a) * H * 0.22 * (0.35 + t)
      });
    }
  }
  Sound.unlock();
  drawing = true;
  lastPt = { x: path[0].x, y: path[0].y, t: performance.now() };
  if (mode === "genome") Sound.holdStart(420);
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    const dt = p.linger ? 80 : 22;
    if (i > 0) {
      const prev = path[i - 1];
      const d = hypot(p.x - prev.x, p.y - prev.y);
      const n = Math.max(1, Math.ceil(d / (TILE * 0.42)));
      for (let k = 1; k <= n; k++) {
        stroke(lerp(prev.x, p.x, k / n), lerp(prev.y, p.y, k / n), dt);
      }
    } else {
      stroke(p.x, p.y, dt);
    }
    lastPt = { x: p.x, y: p.y, t: performance.now() };
  }
  $("brush").style.transform = "translate(" + path[path.length - 1].x + "px, " + path[path.length - 1].y + "px)";
  onUp();
}

boot();
</script>
